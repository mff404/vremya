<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Расписание учебного дня</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="app-container">
        <header>
            <h1>Учебный день</h1>
            <p>14:00 – 20:00</p>
            <button id="startBtn" class="primary-btn">Запустить расписание (Включить звук)</button>
        </header>

        <main>
            <div class="current-status" id="currentStatus">
                <h2>Ожидание запуска...</h2>
                <div class="timer" id="countdown">00:00:00</div>
                <p class="description" id="currentDesc">Нажмите кнопку выше, чтобы активировать отслеживание и звук.</p>
            </div>

            <div class="timeline" id="timeline">
                <!-- Timeline items generated by JS -->
            </div>
        </main>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
